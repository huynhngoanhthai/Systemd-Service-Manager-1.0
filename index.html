<style>
/* ============================================================
   aaPanel Native Theme Integration (Variables & Theme Adaptation)
   ============================================================ */
:root {
    --sm-bg: var(--layui-layer-bg, #ffffff);
    --sm-bg-container: #ffffff;
    --sm-bg-subtle: #f8f9fa;
    --sm-bg-hover: #f9fbf8;
    --sm-bg-card: #ffffff;
    --sm-border: #ebeef5;
    --sm-border-subtle: #f0f2f5;
    --sm-border-nav: #edf0f5;
    --sm-text-primary: #333333;
    --sm-text-title: #2c3e50;
    --sm-text-secondary: #666666;
    --sm-text-muted: #888888;
    --sm-text-hint: #999999;
    --sm-input-bg: #ffffff;
    --sm-input-border: #dcdfe6;
    --sm-input-text: #333333;
    --sm-badge-bg: #f0f2f5;
    --sm-badge-text: #888888;
    --sm-primary: #20a53a;
    --sm-primary-hover: #1a822e;
    --sm-tag-custom-bg: #e8f4ff;
    --sm-tag-custom-text: #1890ff;
    --sm-tag-custom-border: #d1e9ff;
    --sm-tag-boot-on-bg: #f0f9eb;
    --sm-tag-boot-on-text: #20a53a;
    --sm-tag-boot-on-border: #e1f3d8;
    --sm-tag-boot-off-bg: #f4f4f5;
    --sm-tag-boot-off-text: #909399;
    --sm-tag-boot-off-border: #e9e9eb;
    --sm-terminal-bg: #1e1e1e;
    --sm-terminal-text: #abb2bf;
    --sm-terminal-border: #333333;
}

/* aaPanel Dark Theme Active Selectors (Applied ONLY when aaPanel is in dark mode or user forces dark) */
html[data-theme="dark"],
body[data-theme="dark"],
[data-theme="dark"],
body.dark,
body.theme-dark,
body.bt-dark,
.layui-layer-theme-dark,
#sm_container.sm-dark,
.sm-layer-dark,
.sm-modal-dark,
.sm-modal-body.sm-dark {
    --sm-bg: #202020;
    --sm-bg-container: #202020;
    --sm-bg-subtle: #282828;
    --sm-bg-hover: #2b332c;
    --sm-bg-card: #252525;
    --sm-border: #383838;
    --sm-border-subtle: #2f2f2f;
    --sm-border-nav: #3a3a3a;
    --sm-text-primary: #e0e0e0;
    --sm-text-title: #f0f0f0;
    --sm-text-secondary: #b3b3b3;
    --sm-text-muted: #8c8c8c;
    --sm-text-hint: #707070;
    --sm-input-bg: #2b2b2b;
    --sm-input-border: #444444;
    --sm-input-text: #f0f0f0;
    --sm-badge-bg: #323232;
    --sm-badge-text: #aaaaaa;
    --sm-primary: #20a53a;
    --sm-primary-hover: #29be46;
    --sm-tag-custom-bg: #142838;
    --sm-tag-custom-text: #40a9ff;
    --sm-tag-custom-border: #1a4263;
    --sm-tag-boot-on-bg: #162e1e;
    --sm-tag-boot-on-text: #49cc6b;
    --sm-tag-boot-on-border: #235933;
    --sm-tag-boot-off-bg: #2a2a2a;
    --sm-tag-boot-off-text: #8c8c8c;
    --sm-tag-boot-off-border: #3f3f3f;
    --sm-terminal-bg: #141414;
    --sm-terminal-text: #d4d4d4;
    --sm-terminal-border: #2e2e2e;
}

/* Dark Mode Scrollbars */
.sm-dark ::-webkit-scrollbar,
.sm-layer-dark ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
}
.sm-dark ::-webkit-scrollbar-track,
.sm-layer-dark ::-webkit-scrollbar-track {
    background: #202020;
}
.sm-dark ::-webkit-scrollbar-thumb,
.sm-layer-dark ::-webkit-scrollbar-thumb {
    background: #444444;
    border-radius: 3px;
}
.sm-dark ::-webkit-scrollbar-thumb:hover,
.sm-layer-dark ::-webkit-scrollbar-thumb:hover {
    background: #555555;
}

/* Service Manager Clean UI - aaPanel Style */
#sm_container {
    padding: 15px 20px 20px;
    font-size: 12px;
    color: var(--sm-text-primary);
    background: var(--sm-bg-container);
    min-height: 520px;
    box-sizing: border-box;
    transition: background-color 0.2s ease, color 0.2s ease;
}

/* Top Navigation Tabs */
.sm-nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--sm-border-nav);
    padding-bottom: 0;
    margin-bottom: 15px;
}
.sm-nav-tabs {
    display: flex;
    gap: 20px;
    margin-bottom: -2px;
}
.sm-nav-tab {
    padding: 8px 4px 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--sm-text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    user-select: none;
}
.sm-nav-tab:hover {
    color: var(--sm-primary);
}
.sm-nav-tab.active {
    color: var(--sm-primary);
    font-weight: 600;
    border-bottom: 2px solid var(--sm-primary);
}
.sm-nav-count {
    display: inline-block;
    padding: 1px 6px;
    font-size: 11px;
    font-weight: normal;
    border-radius: 10px;
    background: var(--sm-badge-bg);
    color: var(--sm-badge-text);
    margin-left: 4px;
}
.sm-nav-tab.active .sm-nav-count {
    background: var(--sm-tag-boot-on-bg);
    color: var(--sm-tag-boot-on-text);
}
.sm-nav-stats {
    font-size: 12px;
    color: var(--sm-text-muted);
}

/* Toolbar & Filters */
.sm-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
    flex-wrap: wrap;
}
.sm-toolbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
}
.sm-toolbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
}
.sm-input {
    height: 30px;
    padding: 0 10px;
    border: 1px solid var(--sm-input-border);
    background: var(--sm-input-bg);
    color: var(--sm-input-text);
    border-radius: 3px;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s, background-color 0.2s, color 0.2s;
}
.sm-input:focus {
    border-color: var(--sm-primary);
}
.sm-select {
    height: 30px;
    padding: 0 8px;
    border: 1px solid var(--sm-input-border);
    border-radius: 3px;
    font-size: 12px;
    background: var(--sm-input-bg);
    color: var(--sm-input-text);
    outline: none;
    transition: border-color 0.2s, background-color 0.2s, color 0.2s;
}
.sm-select:focus {
    border-color: var(--sm-primary);
}

/* Clean Table */
.sm-table-wrap {
    border: 1px solid var(--sm-border);
    border-radius: 4px;
    overflow: hidden;
    max-height: 410px;
    overflow-y: auto;
    background: var(--sm-bg-container);
}
.sm-table {
    width: 100%;
    margin-bottom: 0;
    border-collapse: collapse;
}
.sm-table thead th {
    position: sticky;
    top: 0;
    background: var(--sm-bg-subtle);
    color: var(--sm-text-primary);
    font-weight: 600;
    font-size: 12px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--sm-border);
    z-index: 2;
    white-space: nowrap;
}
.sm-table tbody td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--sm-border-subtle);
    vertical-align: middle;
    font-size: 12px;
    color: var(--sm-text-primary);
    background: transparent;
}
.sm-table tbody tr:hover td {
    background-color: var(--sm-bg-hover);
}
.sm-service-name {
    font-weight: 500;
    color: var(--sm-text-title);
}
.sm-service-desc {
    color: var(--sm-text-muted);
}
.sm-empty-text {
    padding: 35px;
    color: var(--sm-text-hint);
}

/* Status Indicators */
.sm-status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: 500;
}
.sm-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
}
.sm-dot-running { background-color: var(--sm-primary); }
.sm-dot-stopped { background-color: var(--sm-text-hint); }
.sm-dot-failed { background-color: #f56c6c; }

.sm-tag-pill {
    display: inline-block;
    padding: 1px 6px;
    font-size: 11px;
    border-radius: 3px;
}
.sm-tag-custom {
    background: var(--sm-tag-custom-bg);
    color: var(--sm-tag-custom-text);
    border: 1px solid var(--sm-tag-custom-border);
    margin-right: 5px;
    font-weight: 500;
}
.sm-tag-boot-on {
    color: var(--sm-tag-boot-on-text);
    background: var(--sm-tag-boot-on-bg);
    border: 1px solid var(--sm-tag-boot-on-border);
}
.sm-tag-boot-off {
    color: var(--sm-tag-boot-off-text);
    background: var(--sm-tag-boot-off-bg);
    border: 1px solid var(--sm-tag-boot-off-border);
}

/* Action Links (aaPanel Style) */
.sm-op-link {
    color: var(--sm-primary);
    cursor: pointer;
    text-decoration: none;
    margin: 0 4px;
}
.sm-op-link:hover {
    text-decoration: underline;
    color: var(--sm-primary-hover);
}
.sm-op-link.danger {
    color: #f56c6c;
}
.sm-op-link.danger:hover {
    color: #cf3d3d;
}
.sm-op-link.muted {
    color: var(--sm-text-secondary);
}
.sm-op-link.muted:hover {
    color: var(--sm-text-primary);
}
.sm-op-sep {
    color: var(--sm-border);
}

/* Footer / Pagination */
.sm-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    font-size: 12px;
    color: var(--sm-text-muted);
}
.sm-page-text {
    font-size: 11px;
    color: var(--sm-text-secondary);
    margin: 0 4px;
}

/* Modal Form Styles */
.sm-modal-body {
    padding: 15px 20px;
    font-size: 12px;
    background: var(--sm-bg-container);
    color: var(--sm-text-primary);
    box-sizing: border-box;
}
.sm-detail-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    background: var(--sm-bg-subtle);
    border: 1px solid var(--sm-border);
    padding: 8px 12px;
    border-radius: 4px;
}
.sm-modal-title {
    font-size: 13px;
    color: var(--sm-text-title);
}
.sm-modal-subtitle {
    margin-left: 8px;
    color: var(--sm-text-muted);
    font-size: 11px;
}
.sm-edit-filepath-label {
    margin-bottom: 8px;
    color: var(--sm-text-secondary);
    font-size: 11px;
}
.sm-accent-text {
    color: var(--sm-primary);
}
.sm-modal-tab-bar {
    display: flex;
    gap: 12px;
    border-bottom: 1px solid var(--sm-border);
    margin-bottom: 12px;
    padding-bottom: 6px;
}
.sm-modal-footer {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 15px;
    padding-top: 10px;
    border-top: 1px solid var(--sm-border);
}
.sm-line {
    display: flex;
    margin-bottom: 12px;
    align-items: center;
}
.sm-line-label {
    width: 140px;
    color: var(--sm-text-secondary);
    font-weight: 500;
}
.sm-line-content {
    flex: 1;
}
.sm-terminal {
    background: var(--sm-terminal-bg);
    color: var(--sm-terminal-text);
    border: 1px solid var(--sm-terminal-border);
    padding: 12px;
    font-family: Consolas, Monaco, "Courier New", monospace;
    font-size: 12px;
    border-radius: 4px;
    max-height: 420px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
    line-height: 1.5;
}

/* Layui Layer Dark Theme Adaptation (Active ONLY in Dark mode) */
.sm-layer-dark.layui-layer,
.sm-layer-dark,
[data-theme="dark"] .layui-layer,
body.dark .layui-layer,
body.theme-dark .layui-layer,
body.bt-dark .layui-layer {
    background-color: #202020 !important;
    background: #202020 !important;
    border: 1px solid #383838 !important;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7) !important;
}
.sm-layer-dark .layui-layer-title,
.sm-layer-dark.layui-layer .layui-layer-title,
[data-theme="dark"] .layui-layer-title,
body.dark .layui-layer-title,
body.theme-dark .layui-layer-title,
body.bt-dark .layui-layer-title {
    background-color: #282828 !important;
    background: #282828 !important;
    color: #f0f0f0 !important;
    border-bottom: 1px solid #383838 !important;
}
.sm-layer-dark .layui-layer-content,
.sm-layer-dark.layui-layer .layui-layer-content,
[data-theme="dark"] .layui-layer-content,
body.dark .layui-layer-content,
body.theme-dark .layui-layer-content,
body.bt-dark .layui-layer-content {
    background-color: #202020 !important;
    background: #202020 !important;
    color: #e0e0e0 !important;
}
.sm-layer-dark .layui-layer-close,
.sm-layer-dark.layui-layer .layui-layer-close,
[data-theme="dark"] .layui-layer-close,
body.dark .layui-layer-close,
body.theme-dark .layui-layer-close,
body.bt-dark .layui-layer-close {
    filter: invert(1) brightness(0.85) !important;
}
.sm-layer-dark .layui-layer-btn,
.sm-layer-dark.layui-layer .layui-layer-btn {
    background-color: #282828 !important;
    border-top: 1px solid #383838 !important;
}
[data-theme="dark"] .btn-default,
body.dark .btn-default,
body.theme-dark .btn-default,
body.bt-dark .btn-default,
#sm_container.sm-dark .btn-default,
.sm-modal-dark .btn-default,
.sm-layer-dark .btn-default,
.sm-layer-dark.layui-layer .btn-default {
    background-color: #2b2b2b !important;
    border-color: #444444 !important;
    color: #e0e0e0 !important;
}
[data-theme="dark"] .btn-default:hover,
body.dark .btn-default:hover,
body.theme-dark .btn-default:hover,
body.bt-dark .btn-default:hover,
#sm_container.sm-dark .btn-default:hover,
.sm-modal-dark .btn-default:hover,
.sm-layer-dark .btn-default:hover,
.sm-layer-dark.layui-layer .btn-default:hover {
    background-color: #383838 !important;
    border-color: #555555 !important;
    color: #ffffff !important;
}
</style>

<div id="sm_container">
    <!-- Top Navigation Tabs (Categorization) -->
    <div class="sm-nav-bar">
        <div class="sm-nav-tabs">
            <div class="sm-nav-tab active" data-filter="custom" onclick="smApp.switchTab('custom')">
                <span class="glyphicon glyphicon-star" style="font-size: 11px;"></span> Custom Services
                <span class="sm-nav-count" id="count_custom">0</span>
            </div>
            <div class="sm-nav-tab" data-filter="all" onclick="smApp.switchTab('all')">
                All System Services
                <span class="sm-nav-count" id="count_all">0</span>
            </div>
        </div>
        <div class="sm-nav-stats">
            Running: <b style="color: var(--sm-primary);" id="count_running">0</b> | Stopped: <span id="count_stopped">0</span>
            <span id="wrap_failed" style="display:none; color: #f56c6c; margin-left: 6px;">| Failed: <b id="count_failed">0</b></span>
        </div>
    </div>

    <!-- Toolbar: Search, Filters & Actions -->
    <div class="sm-toolbar">
        <div class="sm-toolbar-left">
            <button class="btn btn-success btn-sm" onclick="smApp.openAddModal()" style="font-weight: 500;">
                <span class="glyphicon glyphicon-plus"></span> Add New Service
            </button>
            <select id="sm_status_filter" class="sm-select" onchange="smApp.onStatusFilterChange(this.value)">
                <option value="all">All Statuses</option>
                <option value="running">&#9679; Running</option>
                <option value="stopped">&#9675; Stopped</option>
                <option value="failed">&#9650; Failed</option>
                <option value="enabled">Enabled at Boot</option>
            </select>
            <button class="btn btn-default btn-sm" onclick="smApp.daemonReload()" title="Reload systemd daemon (systemctl daemon-reload)">
                <span class="glyphicon glyphicon-refresh"></span> Daemon Reload
            </button>
        </div>
        <div class="sm-toolbar-right">
            <div style="position: relative;">
                <input type="text" id="sm_search_box" class="sm-input" placeholder="Search service name..." style="width: 200px;" onkeyup="if(event.keyCode==13) smApp.doSearch();" />
            </div>
            <button class="btn btn-default btn-sm" onclick="smApp.doSearch()">Search</button>
            <button class="btn btn-default btn-sm" onclick="smApp.refresh()" title="Refresh data">
                <span class="glyphicon glyphicon-repeat"></span>
            </button>
        </div>
    </div>

    <!-- Main Table -->
    <div class="sm-table-wrap">
        <table class="table sm-table">
            <thead>
                <tr>
                    <th width="32%">Service Name</th>
                    <th width="28%">Description</th>
                    <th width="15%">Status</th>
                    <th width="10%">Boot</th>
                    <th width="15%" class="text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="sm_tbody">
                <tr>
                    <td colspan="5" class="text-center sm-empty-text">
                        <span class="glyphicon glyphicon-refresh" style="animation: spin 1s infinite linear;"></span> Loading service list...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination & Summary -->
    <div class="sm-footer">
        <div id="sm_footer_info">Loading...</div>
        <div id="sm_pagination" style="display: flex; gap: 5px; align-items: center;"></div>
    </div>
</div>

<script>
(function() {
    try { localStorage.removeItem('sm_theme_pref'); } catch(e) {}
    // Popup window optimization for aaPanel GUI
    var $layer = $('#sm_container').parents('.layui-layer');
    if ($layer.length) {
        var winW = $(window).width();
        var targetW = Math.min(880, winW - 40);
        $layer.css({
            width: targetW + 'px',
            left: Math.max(10, (winW - targetW) / 2) + 'px',
            top: '60px'
        });
        $layer.find('.layui-layer-title').html('<span class="glyphicon glyphicon-cog" style="color:#20a53a; margin-right:6px;"></span> <b>Systemd Service Manager</b>');
    }

    var smApp = {
        currentTab: 'custom',
        statusFilter: 'all',
        keyword: '',
        page: 1,
        limit: 50,

        detectAaPanelTheme: function() {
            // 1. Check aaPanel theme attribute on <html> or <body>
            var htmlTheme = ($('html').attr('data-theme') || '').toLowerCase();
            var bodyTheme = ($('body').attr('data-theme') || '').toLowerCase();
            if (htmlTheme === 'dark' || bodyTheme === 'dark' || htmlTheme.indexOf('dark') !== -1 || bodyTheme.indexOf('dark') !== -1) {
                return 'dark';
            }
            if (htmlTheme === 'light' || bodyTheme === 'light' || htmlTheme.indexOf('light') !== -1 || bodyTheme.indexOf('light') !== -1) {
                return 'light';
            }

            // 2. Check aaPanel classes
            if ($('html').hasClass('dark') || $('body').hasClass('dark') ||
                $('body').hasClass('theme-dark') || $('body').hasClass('bt-dark') ||
                $('body').hasClass('dark-theme')) {
                return 'dark';
            }

            // 3. Check aaPanel localStorage / cookies
            try {
                var lsTheme = (localStorage.getItem('aapanel_theme') || localStorage.getItem('theme') || localStorage.getItem('bt_theme') || '').toLowerCase();
                if (lsTheme === 'dark' || lsTheme === 'dark-theme') return 'dark';
                if (lsTheme === 'light' || lsTheme === 'light-theme') return 'light';
            } catch(e) {}

            // 4. Inspect computed background color of aaPanel's main elements
            try {
                var targets = [
                    $('.main-content'),
                    $('#main-content'),
                    $('.warpper'),
                    $('.container-fluid'),
                    $('body'),
                    $('.sidebar'),
                    $('#sidebar')
                ];
                for (var i = 0; i < targets.length; i++) {
                    var $el = targets[i];
                    if ($el && $el.length) {
                        var bg = $el.css('background-color');
                        if (bg && bg !== 'transparent' && bg !== 'rgba(0, 0, 0, 0)') {
                            var rgb = bg.match(/\d+/g);
                            if (rgb && rgb.length >= 3) {
                                var brightness = (parseInt(rgb[0]) * 299 + parseInt(rgb[1]) * 587 + parseInt(rgb[2]) * 114) / 1000;
                                if (brightness < 100) {
                                    return 'dark';
                                } else if (brightness > 140) {
                                    return 'light';
                                }
                            }
                        }
                    }
                }
            } catch(e) {}

            // aaPanel default is always Light mode
            return 'light';
        },

        applyModalTheme: function($l) {
            if (!$l || !$l.length) return;
            var isDark = (this.detectAaPanelTheme() === 'dark');
            if (isDark) {
                $l.addClass('sm-layer-dark');
                $l.css({
                    'background-color': '#202020',
                    'border': '1px solid #383838'
                });
                $l.find('.sm-modal-body').addClass('sm-dark');
                $l.find('.layui-layer-title').css({
                    'background-color': '#282828',
                    'background': '#282828',
                    'color': '#f0f0f0',
                    'border-bottom': '1px solid #383838'
                });
                $l.find('.layui-layer-close').css({
                    'filter': 'invert(1) brightness(0.85)'
                });
            } else {
                $l.removeClass('sm-layer-dark');
                $l.css({
                    'background-color': '',
                    'border': ''
                });
                $l.find('.sm-modal-body').removeClass('sm-dark');
                $l.find('.layui-layer-title').css({
                    'background-color': '',
                    'background': '',
                    'color': '',
                    'border-bottom': ''
                });
                $l.find('.layui-layer-close').css({
                    'filter': ''
                });
            }
        },

        syncTheme: function() {
            var currentTheme = this.detectAaPanelTheme();
            var isDark = (currentTheme === 'dark');
            var $c = $('#sm_container');
            var $parentLayer = $c.parents('.layui-layer');

            if (isDark) {
                $c.addClass('sm-dark');
                $parentLayer.addClass('sm-layer-dark');
                $parentLayer.css({
                    'background-color': '#202020',
                    'border': '1px solid #383838'
                });
                $parentLayer.find('.layui-layer-title').css({
                    'background-color': '#282828',
                    'background': '#282828',
                    'color': '#f0f0f0',
                    'border-bottom': '1px solid #383838'
                });
                $parentLayer.find('.layui-layer-close').css({
                    'filter': 'invert(1) brightness(0.85)'
                });
                $('.layui-layer:has(.sm-modal-body)').addClass('sm-layer-dark').css({
                    'background-color': '#202020',
                    'border': '1px solid #383838'
                });
                $('.layui-layer:has(.sm-modal-body) .layui-layer-title').css({
                    'background-color': '#282828',
                    'background': '#282828',
                    'color': '#f0f0f0',
                    'border-bottom': '1px solid #383838'
                });
                $('.layui-layer:has(.sm-modal-body) .layui-layer-close').css({
                    'filter': 'invert(1) brightness(0.85)'
                });
                $('.sm-modal-body').addClass('sm-dark');
            } else {
                $c.removeClass('sm-dark');
                $parentLayer.removeClass('sm-layer-dark');
                $parentLayer.css({
                    'background-color': '',
                    'border': ''
                });
                $parentLayer.find('.layui-layer-title').css({
                    'background-color': '',
                    'background': '',
                    'color': '',
                    'border-bottom': ''
                });
                $parentLayer.find('.layui-layer-close').css({
                    'filter': ''
                });
                $('.layui-layer:has(.sm-modal-body)').removeClass('sm-layer-dark').css({
                    'background-color': '',
                    'border': ''
                });
                $('.layui-layer:has(.sm-modal-body) .layui-layer-title').css({
                    'background-color': '',
                    'background': '',
                    'color': '',
                    'border-bottom': ''
                });
                $('.layui-layer:has(.sm-modal-body) .layui-layer-close').css({
                    'filter': ''
                });
                $('.sm-modal-body').removeClass('sm-dark');
            }
        },

        bindThemeObserver: function() {
            var self = this;
            self.syncTheme();
            if (window.MutationObserver) {
                var obs = new MutationObserver(function() {
                    self.syncTheme();
                });
                if (document.documentElement) {
                    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
                }
                if (document.body) {
                    obs.observe(document.body, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
                }
            }
        },

        api: function(action_name, params, callback) {
            var loadIdx = layer.load(2, { time: 8000 });
            var postData = $.extend({}, params || {});
            // Critical: If postData contains 'action', rename to 'act' so it doesn't overwrite aaPanel's 'action=a'
            if (postData.action !== undefined && postData.act === undefined) {
                postData.act = postData.action;
                delete postData.action;
            }
            $.ajax({
                type: 'POST',
                url: '/plugin?action=a&name=service_manager&s=' + action_name,
                data: postData,
                dataType: 'json',
                success: function(res) {
                    layer.close(loadIdx);
                    if (callback) callback(res);
                },
                error: function(xhr, status, err) {
                    layer.close(loadIdx);
                    layer.msg('Server connection error: ' + err, { icon: 2 });
                }
            });
        },

        switchTab: function(tabName) {
            this.currentTab = tabName;
            this.page = 1;
            $('.sm-nav-tab').removeClass('active');
            $('.sm-nav-tab[data-filter="' + tabName + '"]').addClass('active');
            this.load();
        },

        onStatusFilterChange: function(val) {
            this.statusFilter = val;
            this.page = 1;
            this.load();
        },

        doSearch: function() {
            this.keyword = $('#sm_search_box').val().trim();
            this.page = 1;
            this.load();
        },

        refresh: function() {
            this.load(true);
        },

        load: function(notify) {
            var self = this;
            var ft = self.statusFilter;
            if (self.currentTab === 'custom') {
                ft = (self.statusFilter === 'all') ? 'custom' : self.statusFilter;
            }

            self.api('get_service_list', {
                filter_type: ft,
                search: self.keyword,
                p: self.page,
                row: self.limit
            }, function(res) {
                if (!res.status) {
                    layer.msg(res.msg || 'Unable to load service list', { icon: 2 });
                    return;
                }
                if (notify) {
                    layer.msg('Data refreshed', { icon: 1, time: 800 });
                }

                // Update counter statistics on navigation bar
                var st = res.stats || {};
                $('#count_custom').text(st.custom || 0);
                $('#count_all').text(st.total || 0);
                $('#count_running').text(st.running || 0);
                $('#count_stopped').text(st.stopped || 0);

                if (st.failed > 0) {
                    $('#count_failed').text(st.failed);
                    $('#wrap_failed').show();
                } else {
                    $('#wrap_failed').hide();
                }

                var list = res.data || [];
                if (self.currentTab === 'custom' && self.statusFilter !== 'all') {
                    list = list.filter(function(item) {
                        return item.is_custom === true;
                    });
                }

                self.renderTable(list);
                self.renderPagination(res.total, res.page, res.limit);
            });
        },

        renderTable: function(items) {
            var html = '';
            if (!items || items.length === 0) {
                var emptyMsg = this.currentTab === 'custom' ?
                    'No custom services found (click <b>+ Add New Service</b> to create one)' :
                    'No matching services found';
                html = '<tr><td colspan="5" class="text-center sm-empty-text">' + emptyMsg + '</td></tr>';
                $('#sm_tbody').html(html);
                return;
            }

            for (var i = 0; i < items.length; i++) {
                var s = items[i];
                var isRunning = (s.active === 'active' && s.sub === 'running');
                var isFailed = (s.active === 'failed' || s.sub === 'failed');

                // Status indicator
                var statusHtml = '';
                if (isRunning) {
                    statusHtml = '<span class="sm-status-indicator" style="color: var(--sm-primary);"><span class="sm-dot sm-dot-running"></span> Running</span>';
                } else if (isFailed) {
                    statusHtml = '<span class="sm-status-indicator" style="color: #f56c6c;"><span class="sm-dot sm-dot-failed"></span> Failed (' + s.sub + ')</span>';
                } else {
                    statusHtml = '<span class="sm-status-indicator" style="color: var(--sm-text-muted);"><span class="sm-dot sm-dot-stopped"></span> ' + (s.sub === 'dead' ? 'Stopped' : (s.sub || 'Stopped')) + '</span>';
                }

                // Boot tag
                var isBoot = (s.unit_file_state === 'enabled');
                var bootHtml = isBoot ?
                    '<a href="javascript:;" onclick="smApp.doAction(\'' + s.name + '\', \'disable\')" title="Click to disable auto-start on boot"><span class="sm-tag-pill sm-tag-boot-on">Enabled</span></a>' :
                    '<a href="javascript:;" onclick="smApp.doAction(\'' + s.name + '\', \'enable\')" title="Click to enable auto-start on boot"><span class="sm-tag-pill sm-tag-boot-off">Disabled</span></a>';

                var tagCustom = s.is_custom ? '<span class="sm-tag-pill sm-tag-custom">Custom</span>' : '';

                // Actions links
                var ops = '<div class="text-right" style="white-space: nowrap;">';
                if (isRunning) {
                    ops += '<a class="sm-op-link muted" onclick="smApp.doAction(\'' + s.name + '\', \'stop\')">Stop</a>';
                    ops += '<span class="sm-op-sep">|</span>';
                    ops += '<a class="sm-op-link" onclick="smApp.doAction(\'' + s.name + '\', \'restart\')">Restart</a>';
                } else {
                    ops += '<a class="sm-op-link" onclick="smApp.doAction(\'' + s.name + '\', \'start\')">Start</a>';
                }

                ops += '<span class="sm-op-sep">|</span>';
                ops += '<a class="sm-op-link muted" onclick="smApp.openDetailModal(\'' + s.name + '\')">Logs</a>';
                ops += '<span class="sm-op-sep">|</span>';
                ops += '<a class="sm-op-link muted" onclick="smApp.openEditModal(\'' + s.name + '\')">Edit</a>';

                if (s.is_custom) {
                    ops += '<span class="sm-op-sep">|</span>';
                    ops += '<a class="sm-op-link danger" onclick="smApp.confirmDelete(\'' + s.name + '\')">Delete</a>';
                }
                ops += '</div>';

                var desc = s.desc || '-';
                if (desc.length > 50) desc = desc.substr(0, 50) + '...';

                html += '<tr>' +
                    '<td>' + tagCustom + '<span class="sm-service-name">' + s.name + '</span></td>' +
                    '<td class="sm-service-desc" title="' + (s.desc || '') + '">' + desc + '</td>' +
                    '<td>' + statusHtml + '</td>' +
                    '<td>' + bootHtml + '</td>' +
                    '<td>' + ops + '</td>' +
                    '</tr>';
            }

            $('#sm_tbody').html(html);
        },

        renderPagination: function(total, page, limit) {
            $('#sm_footer_info').text('Total: ' + total + ' service(s)' + (this.currentTab === 'custom' ? ' (Custom mode)' : ''));
            if (limit <= 0 || total <= limit) {
                $('#sm_pagination').html('');
                return;
            }
            var totalPages = Math.ceil(total / limit);
            var html = '';
            html += '<button class="btn btn-default btn-xs" ' + (page <= 1 ? 'disabled' : '') + ' onclick="smApp.goPage(' + (page - 1) + ')">&laquo; Prev</button>';
            html += '<span class="sm-page-text">Page ' + page + ' of ' + totalPages + '</span>';
            html += '<button class="btn btn-default btn-xs" ' + (page >= totalPages ? 'disabled' : '') + ' onclick="smApp.goPage(' + (page + 1) + ')">Next &raquo;</button>';
            $('#sm_pagination').html(html);
        },

        goPage: function(p) {
            this.page = p;
            this.load();
        },

        doAction: function(serviceName, action) {
            var self = this;
            self.api('service_action', { service_name: serviceName, act: action }, function(res) {
                if (res.status) {
                    layer.msg(res.msg, { icon: 1, time: 1000 });
                    setTimeout(function() { self.load(); }, 600);
                } else {
                    layer.msg(res.msg || 'Operation failed', { icon: 2 });
                }
            });
        },

        daemonReload: function() {
            var self = this;
            self.api('daemon_reload', {}, function(res) {
                if (res.status) {
                    layer.msg(res.msg, { icon: 1, time: 1000 });
                    self.load();
                } else {
                    layer.msg(res.msg, { icon: 2 });
                }
            });
        },

        confirmDelete: function(serviceName) {
            var self = this;
            layer.confirm('Are you sure you want to delete service <b>' + serviceName + '</b> from the system?<br><small style="color: var(--sm-text-muted);">The unit file in /etc/systemd/system/ will be deleted and the service will be stopped.</small>', {
                title: 'Confirm Deletion',
                icon: 0,
                btn: ['Delete', 'Cancel'],
                success: function($l) {
                    self.applyModalTheme($l);
                }
            }, function(index) {
                layer.close(index);
                self.api('delete_service', { name: serviceName }, function(res) {
                    if (res.status) {
                        layer.msg(res.msg, { icon: 1 });
                        self.load();
                    } else {
                        layer.msg(res.msg, { icon: 2 });
                    }
                });
            });
        },

        openDetailModal: function(serviceName) {
            var self = this;
            self.api('get_service_detail', { service_name: serviceName }, function(res) {
                if (!res.status) {
                    layer.msg(res.msg, { icon: 2 });
                    return;
                }
                var d = res.data;
                var content = '<div class="sm-modal-body">' +
                    '<div class="sm-detail-header">' +
                        '<div>' +
                            '<b class="sm-modal-title">' + d.name + '</b>' +
                            '<span class="sm-modal-subtitle">PID: <b>' + (d.main_pid || '-') + '</b> | RAM: <b>' + (d.memory || '-') + '</b></span>' +
                        '</div>' +
                        '<div>' +
                            '<button class="btn btn-default btn-xs" onclick="smApp.refreshLogs(\'' + d.name + '\')"><span class="glyphicon glyphicon-repeat"></span> Refresh</button>' +
                        '</div>' +
                    '</div>' +
                    '<div id="sm_detail_pre" class="sm-terminal">' + (d.status_text + '\n\n--- RECENT 50 JOURNAL LOG LINES ---\n' + d.recent_logs) + '</div>' +
                '</div>';

                layer.open({
                    type: 1,
                    title: 'Status & Journal Logs: ' + serviceName,
                    area: ['720px', '490px'],
                    shadeClose: true,
                    closeBtn: 1,
                    content: content,
                    success: function($l) {
                        self.applyModalTheme($l);
                        var pre = $l.find('#sm_detail_pre');
                        if (pre.length) pre.scrollTop(pre[0].scrollHeight);
                    }
                });
            });
        },

        refreshLogs: function(serviceName) {
            this.api('get_service_logs', { service_name: serviceName, lines: 100 }, function(res) {
                if (res.status) {
                    var box = $('#sm_detail_pre');
                    box.text(res.data);
                    box.scrollTop(box[0].scrollHeight);
                    layer.msg('Logs refreshed', { icon: 1, time: 600 });
                }
            });
        },

        openEditModal: function(serviceName) {
            var self = this;
            self.api('get_service_detail', { service_name: serviceName }, function(res) {
                if (!res.status) {
                    layer.msg(res.msg, { icon: 2 });
                    return;
                }
                var d = res.data;
                var filePath = d.fragment_path || ('/etc/systemd/system/' + serviceName);

                var content = '<div class="sm-modal-body">' +
                    '<div class="sm-edit-filepath-label">' +
                        'File: <b class="sm-accent-text">' + filePath + '</b>' +
                    '</div>' +
                    '<textarea id="sm_edit_textarea" class="sm-terminal" style="width:100%; height:290px; resize:none;">' + self.escapeHtml(d.unit_content || '') + '</textarea>' +
                    '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">' +
                        '<label style="font-weight:normal; cursor:pointer; font-size:12px; margin:0; color:var(--sm-text-primary);">' +
                            '<input type="checkbox" id="sm_edit_restart" checked style="vertical-align:middle;"> Restart service after saving' +
                        '</label>' +
                        '<div>' +
                            '<button class="btn btn-default btn-sm" onclick="layer.closeAll()" style="margin-right:6px;">Cancel</button>' +
                            '<button class="btn btn-success btn-sm" onclick="smApp.saveEdit(\'' + serviceName + '\')">Save Configuration</button>' +
                        '</div>' +
                    '</div>' +
                '</div>';

                layer.open({
                    type: 1,
                    title: 'Edit Unit File: ' + serviceName,
                    area: ['700px', '440px'],
                    shadeClose: false,
                    closeBtn: 1,
                    content: content,
                    success: function($l) {
                        self.applyModalTheme($l);
                    }
                });
            });
        },

        saveEdit: function(serviceName) {
            var self = this;
            var text = $('#sm_edit_textarea').val();
            var restart = $('#sm_edit_restart').is(':checked') ? '1' : '0';

            if (!text.trim()) {
                layer.msg('Unit file content cannot be empty', { icon: 2 });
                return;
            }

            self.api('save_service_file', {
                name: serviceName,
                content: text,
                restart: restart
            }, function(res) {
                if (res.status) {
                    layer.msg(res.msg, { icon: 1 });
                    layer.closeAll();
                    self.load();
                } else {
                    layer.msg(res.msg, { icon: 2 });
                }
            });
        },

        openAddModal: function() {
            var self = this;
            var html = '<div class="sm-modal-body">' +
                '<div class="sm-modal-tab-bar">' +
                    '<a href="javascript:;" id="tab_form_btn" class="sm-op-link" style="font-weight:600;" onclick="smApp.switchAddMode(1)">Quick Form</a>' +
                    '<span class="sm-op-sep">|</span>' +
                    '<a href="javascript:;" id="tab_raw_btn" class="sm-op-link muted" onclick="smApp.switchAddMode(2)">Raw Unit File</a>' +
                '</div>' +

                '<div id="add_mode_form">' +
                    '<div class="sm-line">' +
                        '<div class="sm-line-label"><span style="color:#f56c6c;">*</span> Service Name:</div>' +
                        '<div class="sm-line-content"><input type="text" id="a_name" class="sm-input" style="width:100%;" placeholder="e.g.: my-app (.service will be appended automatically)" /></div>' +
                    '</div>' +
                    '<div class="sm-line">' +
                        '<div class="sm-line-label"><span style="color:#f56c6c;">*</span> Exec Command:</div>' +
                        '<div class="sm-line-content"><input type="text" id="a_exec" class="sm-input" style="width:100%;" placeholder="e.g.: /usr/bin/node /www/wwwroot/app/index.js" /></div>' +
                    '</div>' +
                    '<div class="sm-line">' +
                        '<div class="sm-line-label">Working Directory:</div>' +
                        '<div class="sm-line-content"><input type="text" id="a_dir" class="sm-input" style="width:100%;" placeholder="e.g.: /www/wwwroot/app" /></div>' +
                    '</div>' +
                    '<div class="sm-line">' +
                        '<div class="sm-line-label">User / Restart:</div>' +
                        '<div class="sm-line-content" style="display:flex; gap:10px;">' +
                            '<input type="text" id="a_user" class="sm-input" value="root" style="width:100px;" placeholder="User" />' +
                            '<select id="a_restart" class="sm-select" style="flex:1;">' +
                                '<option value="always">Restart: Always (Always restart when terminated)</option>' +
                                '<option value="on-failure">Restart: On-Failure</option>' +
                                '<option value="no">Restart: No</option>' +
                            '</select>' +
                        '</div>' +
                    '</div>' +
                    '<div class="sm-line">' +
                        '<div class="sm-line-label">Environment Vars:</div>' +
                        '<div class="sm-line-content">' +
                            '<input type="text" id="a_env" class="sm-input" style="width:100%;" placeholder="PORT=3000 NODE_ENV=production (separated by spaces or lines)" />' +
                        '</div>' +
                    '</div>' +
                    '<div style="margin-left:140px; margin-top:5px; color:var(--sm-text-primary);">' +
                        '<label style="margin-right:15px; font-weight:normal; cursor:pointer;"><input type="checkbox" id="a_enable" checked> Enable at Boot</label>' +
                        '<label style="font-weight:normal; cursor:pointer;"><input type="checkbox" id="a_start" checked> Start immediately after creation</label>' +
                    '</div>' +
                '</div>' +

                '<div id="add_mode_raw" style="display:none;">' +
                    '<div class="sm-line">' +
                        '<div class="sm-line-label"><span style="color:#f56c6c;">*</span> Service Name:</div>' +
                        '<div class="sm-line-content"><input type="text" id="ar_name" class="sm-input" style="width:100%;" placeholder="e.g.: my-app.service" /></div>' +
                    '</div>' +
                    '<textarea id="ar_content" class="sm-terminal" style="width:100%; height:200px; resize:none;">' +
'[Unit]\nDescription=My Application Service\nAfter=network.target\n\n[Service]\nType=simple\nUser=root\nWorkingDirectory=/www/wwwroot/myapp\nExecStart=/usr/bin/python3 main.py\nRestart=always\nRestartSec=5s\n\n[Install]\nWantedBy=multi-user.target\n' +
                    '</textarea>' +
                    '<div style="margin-top:5px; color:var(--sm-text-primary);">' +
                        '<label style="margin-right:15px; font-weight:normal; cursor:pointer;"><input type="checkbox" id="ar_enable" checked> Enable at Boot</label>' +
                        '<label style="font-weight:normal; cursor:pointer;"><input type="checkbox" id="ar_start" checked> Start immediately</label>' +
                    '</div>' +
                '</div>' +

                '<div class="sm-modal-footer">' +
                    '<button class="btn btn-default btn-sm" onclick="layer.closeAll()" style="margin-right:6px;">Cancel</button>' +
                    '<button class="btn btn-success btn-sm" onclick="smApp.submitAdd()">Create Service</button>' +
                '</div>' +
            '</div>';

            layer.open({
                type: 1,
                title: 'Add New Systemd Service',
                area: ['640px', '420px'],
                shadeClose: false,
                closeBtn: 1,
                content: html,
                success: function($l) {
                    self.applyModalTheme($l);
                }
            });
        },

        switchAddMode: function(m) {
            if (m === 1) {
                $('#tab_form_btn').css('font-weight', '600').removeClass('muted');
                $('#tab_raw_btn').css('font-weight', 'normal').addClass('muted');
                $('#add_mode_form').show();
                $('#add_mode_raw').hide();
            } else {
                $('#tab_form_btn').css('font-weight', 'normal').addClass('muted');
                $('#tab_raw_btn').css('font-weight', '600').removeClass('muted');
                $('#add_mode_form').hide();
                $('#add_mode_raw').show();
            }
        },

        submitAdd: function() {
            var self = this;
            var isRaw = $('#add_mode_raw').is(':visible');
            var postData = {};

            if (isRaw) {
                var name = $('#ar_name').val().trim();
                var content = $('#ar_content').val().trim();
                if (!name) { layer.msg('Please enter service name', { icon: 2 }); return; }
                if (!content) { layer.msg('Please enter unit file content', { icon: 2 }); return; }
                postData = {
                    name: name,
                    raw_content: content,
                    auto_enable: $('#ar_enable').is(':checked') ? '1' : '0',
                    auto_start: $('#ar_start').is(':checked') ? '1' : '0'
                };
            } else {
                var name = $('#a_name').val().trim();
                var exec = $('#a_exec').val().trim();
                if (!name) { layer.msg('Please enter service name', { icon: 2 }); return; }
                if (!exec) { layer.msg('Please enter execution command (ExecStart)', { icon: 2 }); return; }
                postData = {
                    name: name,
                    exec_start: exec,
                    working_dir: $('#a_dir').val().trim(),
                    user: $('#a_user').val().trim() || 'root',
                    restart: $('#a_restart').val() || 'always',
                    env: $('#a_env').val().trim(),
                    auto_enable: $('#a_enable').is(':checked') ? '1' : '0',
                    auto_start: $('#a_start').is(':checked') ? '1' : '0'
                };
            }

            self.api('add_service', postData, function(res) {
                if (res.status) {
                    layer.msg(res.msg, { icon: 1 });
                    layer.closeAll();
                    self.switchTab('custom');
                } else {
                    layer.msg(res.msg, { icon: 2 });
                }
            });
        },

        escapeHtml: function(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    };

    window.smApp = smApp;
    smApp.bindThemeObserver();
    smApp.load();
})();
</script>
